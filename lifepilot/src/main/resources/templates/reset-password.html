<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - LifePilot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reset-box {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .email-box {
            background: #eff6ff;
            color: #2563eb;
            padding: 11px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: bold;
            word-break: break-word;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .reset-btn {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .home-link {
            text-align: center;
            margin-top: 15px;
        }

        .home-link a {
            color: #666;
            text-decoration: none;
        }

        .home-link a:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="reset-box">

        <div class="logo">
            🚀 LifePilot
        </div>

        <p class="subtitle">
            Create your new password
        </p>

        <div class="email-box">
            📧 <span th:text="${email}"></span>
        </div>

        <div class="error" th:if="${error != null}" th:text="${error}">
        </div>

        <form action="/reset-password" method="post">

            <input type="hidden" name="email" th:value="${email}">

            <label>
                New Password
            </label>

            <input type="password" name="newPassword" placeholder="Enter new password" required>

            <label>
                Confirm New Password
            </label>

            <input type="password" name="confirmPassword" placeholder="Confirm new password" required>

            <button type="submit" class="reset-btn">

                Change Password 🔐

            </button>

        </form>

        <div class="login-link">
            Remember your password?
            <a href="/login">Login</a>
        </div>

        <div class="home-link">
            <a href="/">← Back to Home</a>
        </div>

    </div>

</body>

</html>
