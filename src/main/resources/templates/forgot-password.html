<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - LifePilot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .forgot-box {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .reset-btn {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            text-align: center;
            margin-top: 15px;
        }

        .home-link a {
            color: #666;
            text-decoration: none;
        }

        .home-link a:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="forgot-box">

        <div class="logo">🚀 LifePilot</div>

        <p class="subtitle">
            Forgot your password?<br>
            Enter your registered email to continue.
        </p>

        <form action="/forgot-password" method="post">

            <label>Email</label>

            <input type="email" name="email" placeholder="Enter your registered email" required>

            <button type="submit" class="reset-btn">
                Continue 🔐
            </button>

        </form>

        <div class="login-link">
            Remember your password?
            <a href="/login">Login</a>
        </div>

        <div class="home-link">
            <a href="/">← Back to Home</a>
        </div>

    </div>

</body>

</html>
